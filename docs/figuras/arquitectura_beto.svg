<text x="532.0" y="222" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b6f63">Transformer codificador × 12 capas (preentrenado en español)</text>
<text x="532.0" y="246" font-size="12" text-anchor="middle" fill="#333">cada capa = autoatención (12 cabezas: cada token mira a todos los demás) + red feed-forward</text>
<text x="532.0" y="268" font-size="12" text-anchor="middle" fill="#333">sale un vector de 768 números por token que ya "sabe" su contexto: "36" va después de "NHC:"</text>
<text x="532.0" y="288" font-size="11" text-anchor="middle" fill="#555">≈110 M parámetros que se reajustan un poco durante el fine-tuning</text>
<text x="1016" y="340" font-size="11" fill="#7a5b14">capa lineal 768→45</text>
<text x="1016" y="354" font-size="11" fill="#7a5b14">+ softmax (nueva)</text>
<text x="1016" y="384" font-size="11" fill="#7a1f33">argmax → BIO</text>
</g><text x="20" y="420" font-size="11" fill="#555">Los tokens especiales [CLS] y [SEP] no reciben etiqueta (-100). Las piezas "##" son subpalabras: continúan la palabra anterior.</text>
